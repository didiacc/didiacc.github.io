<main class="wrap" id="app"></main>
<script src="quiz.js?v=6"></script>
<script>
(function () {
  var L = DIDI.LINE_ADD;
  var good = [
    '店裡和自己的錢分開，帳會清楚很多',
    '每筆都記，月底整理會輕鬆很多',
    '有記錄又會追，錢比較不會收不回來',
    '單據固定整理，要找的時候馬上找得到',
    '付款清楚，不會漏付也不會重複付',
    '帳和存摺對得起來，代表帳記得很確實',
    '有收支表又會看，經營更有方向'
  ];
  var bad = [
    '店裡和自己的錢一混，就很難看出店到底賺多少。可以先固定用一個店的帳戶收付，現金收支另外記清楚',
    '小錢最容易漏，一個月加起來常常嚇一跳。可以先從「每天收工前記一次」開始',
    '客人欠的錢沒記下來，忙起來就忘了收。可以先列一張「誰還欠多少」的清單',
    '單據放久了容易不見、褪色，要用時找不到。可以先固定每個月整理一次',
    '沒記清楚哪些付了，就容易漏付或重複付。可以先列一張「還要付誰多少」的清單',
    '帳沒跟存摺對過，或常常對不起來，通常是漏記或記錯。可以先從每個月對一次存摺開始',
    '沒有收支表，就只能憑感覺猜這個月有沒有賺。可以先每個月整理一張簡單的收支表'
  ];
  runQuiz({
    title: '砥砥 DiDi｜帳務健檢',
    shortName: '帳務健檢',
    introHtml: '<p>7 題選擇題，1 分鐘填完。<br>填完馬上看結果，知道你的帳哪裡做得好、哪裡要加強。</p>',
    separateIntro: false,
    separateHelp: true,
    questions: [
      { q: '店裡的錢和自己的錢，有分開帳戶嗎？', opts: ['有分開，很少混用', '有分開，但常常混用', '沒有分開'] },
      { q: '店裡的收入和支出，會每一筆都記下來嗎？', opts: ['每一筆都會記', '金額大的才記', '幾乎沒有記'] },
      { q: '客人還沒付的錢，有記下來、也會去追嗎？', opts: ['有記錄，也會固定追', '大概記得，想到才追', '沒有記，常常忘記'] },

      { q: '月底的帳，跟銀行存摺對得起來嗎？', opts: ['每個月都有對，對得起來', '有對，但常常對不起來', '從來沒有對過'] },
      { q: '每個月有一份自己看得懂的收支表嗎？', opts: ['有，而且會拿來看', '有，但看不太懂或很少看', '沒有'] }

    scoreLabel: '你的帳務健檢結果：',
    tiers: [
      { min: 12, max: 14, name: '', html: '<p><strong>你的帳很有條理！繼續保持，每個月花一點時間檢查就好 ✔️</strong></p>' },
      { min: 7, max: 11, name: '', html: '<p><strong>基礎已經有了，有幾個地方再加強，帳會更清楚 ⚠️</strong></p>' },
      { min: 0, max: 6, name: '', html: '<p><strong>帳有點亂沒關係，先從「店裡和自己的錢分開」開始，一步一步整理 ⚠️</strong></p>' }
    ],
    goodHeading: '',
    goodHtml: function (i) { return '<p>✔️ ' + good[i] + '</p>'; },
    improveHeading: '',
    improveHtml: function (i) { return '<p>⚠️ ' + bad[i] + '</p>'; },
    topic: null,
    disclaimer: '※ 健檢結果僅供參考，會計與稅務事項，請以你配合的會計師或記帳士建議為準。',
    helpQ: '需要砥砥幫你一起整理嗎？',
    helpOpts: ['需要', '先不用，謝謝'],
    contactTopHtml: '',
    pick: {
      q: '你最想先處理哪一塊？（可複選）',
      opts: ['單據、發票整理', '收入和支出對不起來', '店裡和自己的錢分開', '客人欠款、廠商付款', '看懂每個月賺多少']
    },
    contactLineHtml: '<p style="margin-top:28px"><strong>加入砥砥 LINE 官方帳號：</strong><br>按下面的按鈕，會打開砥砥的 LINE，並自動帶入你的健檢結果和想處理的項目，按「傳送」砥砥就收到了。</p>',
    privacy: '※ 健檢答案不記名，用來了解老闆們最常遇到的問題；你在 LINE 按下傳送後，砥砥才會收到你的健檢結果和 LINE 名稱。',
    endYesHtml: '<p><strong>謝謝你！砥砥收到後會盡快聯絡你 ⛰️</strong><br>帳務有條理，經營更專注。</p>' +
      '<p class="muted">如果 LINE 沒有自動打開，可以直接加砥砥的 LINE 官方帳號：<a href="' + L + '" target="_blank" rel="noopener">' + L + '</a></p>',
    endNoHtml: '<p><strong>謝謝你完成帳務健檢！有需要隨時<a href="' + L + '" target="_blank" rel="noopener">私訊砥砥</a> ⛰️</strong></p>'
  });
})();
