<script src="quiz.js?v=6"></script>
<script>
(function () {
  var L = DIDI.LINE_ADD;
  var good = [
    '記錄集中在一個地方，要查、要對都很快',
    '帳上和架上對得起來，代表庫存管得很確實',
    '提早補貨，想買的客人不會撲空',
    '知道哪些貨賣不動，錢比較不會壓在倉庫裡',
    '知道誰是主力商品，進貨和主打都有方向',
    '知道每樣商品真正賺多少，訂價和主推都有根據',
    '每個月看毛利，經營更有方向'
  ];
  var bad = [
    '記錄分散在好幾個地方，月底最容易對不起來。可以先把進貨和賣出記在同一張表',
    '沒盤點過、或盤點常常對不起來，通常是漏記、退貨沒補回或遺失。可以先每個月盤點一次，找出差在哪裡',
    '賣完才補貨，想買的客人就撲空了。可以先替熱銷品訂一個「剩多少就補貨」的數量',
    '賣不掉的貨會一直壓住錢。可以先列出放很久沒賣出的商品（例如一個月以上），想辦法出清',

  runQuiz({
    title: '砥砥 DiDi｜庫存健檢',
    shortName: '庫存健檢',
    introHtml: '<p>7 題選擇題，1 分鐘填完。<br>填完馬上看結果，知道你的庫存哪裡做得好、哪裡要加強。</p>',
    separateIntro: false,
    separateHelp: true,
    questions: [
      { q: '進貨、賣出和網路訂單，都記在同一個地方嗎？', opts: ['都記在同一個地方', '分在兩、三個地方', '沒有固定記錄'] },
      { q: '盤點出來的數量，跟記錄對得起來嗎？', opts: ['大致對得起來，差的也查得到原因', '常常差，也查不出原因', '沒有盤點過'] },

    scoreLabel: '你的庫存健檢結果：',
    tiers: [
      { min: 12, max: 14, name: '', html: '<p><strong>你的庫存管得很有條理！繼續保持，每個月盤點一次就好 ✔️</strong></p>' },

      { min: 0, max: 6, name: '', html: '<p><strong>庫存有點亂沒關係，先從「進貨和賣出記在同一個地方」開始，一步一步整理 ⚠️</strong></p>' }
    ],
    goodHeading: '',
    goodHtml: function (i) { return '<p>✔️ ' + good[i] + '</p>'; },
    improveHeading: '',
    improveHtml: function (i) { return '<p>⚠️ ' + bad[i] + '</p>'; },
    topic: null,
    disclaimer: '※ 健檢結果僅供參考，實際帳務與稅務處理，請以你的記帳士或會計師建議為準。',
    helpQ: '需要砥砥幫你一起整理嗎？',
    helpOpts: ['需要', '先不用，謝謝'],
    contactTopHtml: '',
    pick: {
      q: '你最想先處理哪一塊？（可複選）',
      opts: ['進貨、賣出記在同一個地方', '盤點對不起來', '熱銷品常常缺貨', '賣不掉的貨怎麼處理', '算出每樣商品賺多少', '每個月的進銷存報表']
    },
    contactLineHtml: '<p style="margin-top:28px"><strong>加入砥砥 LINE 官方帳號：</strong><br>按下面的按鈕，會打開砥砥的 LINE，並自動帶入你的健檢結果和想處理的項目，按「傳送」砥砥就收到了。</p>',
    privacy: '※ 健檢答案不記名，用來了解老闆們最常遇到的問題；你在 LINE 按下傳送後，砥砥才會收到你的健檢結果和 LINE 名稱。',
    endYesHtml: '<p><strong>謝謝你！砥砥收到後會盡快聯絡你 ⛰️</strong><br>庫存清楚，經營更專注。</p>' +
      '<p class="muted">如果 LINE 沒有自動打開，可以直接加砥砥的 LINE 官方帳號：<a href="' + L + '" target="_blank" rel="noopener">' + L + '</a></p>',
    endNoHtml: '<p><strong>謝謝你完成庫存健檢！有需要隨時<a href="' + L + '" target="_blank" rel="noopener">私訊砥砥</a> ⛰️</strong></p>'
  });
