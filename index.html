<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<title>DIDI BOX</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#111;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="app" title="DIDI BOX" allow="camera; clipboard-write; fullscreen" allowfullscreen></iframe>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbwyGKp0gv5KWRjVnVjCO1vmDkJUJFzC8-KnASW_rQEY2wsvCAhuK8uc9_4YV84BKxeRDg/exec';
  var p = new URLSearchParams(location.search), src = EXEC + '?embed=1&ext=1';
  ['code', 'state', 'error'].forEach(function (k) { var v = p.get(k); if (v) src += '&' + k + '=' + encodeURIComponent(v); });
  // 費用核銷單：員工填單（x）、簽核（s）、出納（c）連結
  var link = ['x', 's', 'c'].filter(function (k) { return p.get(k); })[0];
  if (link) src += '&' + link + '=' + encodeURIComponent(p.get(link));
  document.getElementById('app').src = src;
  // Google 登入帶回來的參數用完就從網址拿掉（重新整理才不會再用一次）；核銷單連結要留著，重新整理才打得開
  if (location.search && !link) history.replaceState(null, '', location.pathname);
})();
</script>
</body>
</html>
